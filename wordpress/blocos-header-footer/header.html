<script>
(function(){
  "use strict";
  /* Menu mobile */
  var hamburger = document.getElementById("hamburgerBtn");
  var panel = document.getElementById("mobilePanel");
  if (!hamburger || !panel) return;
  function closePanel(){
    panel.classList.remove("open");
    hamburger.classList.remove("open");
    hamburger.setAttribute("aria-expanded","false");
  }
  hamburger.addEventListener("click", function(){
    var open = panel.classList.toggle("open");
    hamburger.classList.toggle("open", open);
    hamburger.setAttribute("aria-expanded", open ? "true" : "false");
  });
  panel.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click", closePanel);
  });
  window.addEventListener("resize", function(){
    if (window.innerWidth > 860) closePanel();
  });
  /* Destaca "Funcionalidades" no menu quando estiver nessa pagina */
  if (location.pathname.replace(/\/+$/,"") === "/funcionalidades") {
    document.querySelectorAll('nav.main-nav a[href="/funcionalidades"]').forEach(function(a){ a.classList.add("active"); });
  }
})();
</script>
